tracks:
  - name: stable
    baseImage: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    upstream:
      datasource: github-releases
      depName: Radarr/Radarr
      version: "6.4.4.10685"
    githubRelease:
      tag: "v${version}"
      assets:
        amd64: "Radarr.master.${version}.linux-musl-core-x64.tar.gz"
        arm64: "Radarr.master.${version}.linux-musl-core-arm64.tar.gz"
    tags:
      - "${version}"
      - "${major}"
      - "${major}.${minor}"
      - latest

  - name: prerelease
    baseImage: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    upstream:
      datasource: github-releases
      depName: Radarr/Radarr
      version: "6.4.4.10684"
    prerelease: true
    githubRelease:
      tag: "v${version}"
      assets:
        amd64: "Radarr.develop.${version}.linux-musl-core-x64.tar.gz"
        arm64: "Radarr.develop.${version}.linux-musl-core-arm64.tar.gz"
    tags:
      - "${version}-prerelease"
      - "${major}-prerelease"
      - "${major}.${minor}-prerelease"
