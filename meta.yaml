tracks:
  - name: stable
    baseImage: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    upstream:
      datasource: github-releases
      depName: Radarr/Radarr
      version: "6.4.4.10685"
    buildArgs:
      RADARR_BRANCH: master
    aliases:
      - "{major}"
      - "{major}.{minor}"
      - latest

  - name: prerelease
    baseImage: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    upstream:
      datasource: github-releases
      depName: Radarr/Radarr
      version: "6.4.4.10684"
    prerelease: true
    buildArgs:
      RADARR_BRANCH: develop
    aliases:
      - "{major}-prerelease"
      - "{major}.{minor}-prerelease"
